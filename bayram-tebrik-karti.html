<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regnum Hotel | Bayram Tebriği</title>
  <style>
    :root {
      --gold: #d4af37;
      --overlay: rgba(12, 22, 35, 0.46);
      --text: #ffffff;
      --soft: #f5e7b2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #09111d;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(1200px, 100%);
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(212, 175, 55, 0.55);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      background: linear-gradient(var(--overlay), var(--overlay)),
        url("regnum-ekip-fotografi.jpg") center/cover no-repeat;
    }
    .badge {
      position: absolute;
      top: 28px;
      right: 28px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      padding: 10px 18px;
      letter-spacing: 0.12em;
      font-size: 0.8rem;
      backdrop-filter: blur(2px);
      text-transform: uppercase;
    }
    .content {
      position: absolute;
      inset: auto 0 0;
      padding: 42px;
      background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.4vw, 3.8rem);
      color: var(--gold);
      line-height: 1.05;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    h2 {
      margin: 12px 0 0;
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      font-weight: 500;
      color: var(--soft);
    }
    p {
      margin: 16px 0 0;
      max-width: 75ch;
      line-height: 1.6;
      font-size: clamp(0.95rem, 1.2vw, 1.1rem);
    }
    .signature {
      margin-top: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <section class="card" aria-label="Regnum Hotel bayram tebrik kartı">
    <div class="badge">Regnum Hotel</div>
    <div class="content">
      <h1>İyi Bayramlar</h1>
      <h2>Birlikte nice güzel bayramlara…</h2>
      <p>
        Sevgi, sağlık ve huzur dolu bir bayram geçirmenizi dileriz.
        Regnum Hotel ailesi olarak bayram coşkusunu sizlerle paylaşmaktan mutluluk duyuyoruz.
      </p>
      <p class="signature">Regnum Hotel Ekibi</p>
    </div>
  </section>
</body>
</html>
